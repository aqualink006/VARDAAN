<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vardaan — The strength within</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">

    <a href="index.html" class="logo">VARDAAN</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="origin.html">Origin</a>
      <a href="powers.html">Powers</a>
      <a href="help.html">Ask for help</a>
    </nav>

  </header>


  <main>

    <section class="hero">

      <video class="hero-image" autoplay muted loop playsinline>
  <source src="images/vardaan-hero.mp4" type="video/mp4">
</video>

      <div class="hero-overlay"></div>

      <div class="hero-content">

        <p class="hero-kicker">
          A hero for the unheard
        </p>

        <h1>Vardaan</h1>

        <p class="hero-tagline">
          When the world goes dark,<br>
          she carries the light.
        </p>

        <a href="origin.html" class="hero-button">
          Enter her story <span>→</span>
        </a>

      </div>

      <div class="hero-credit">
        The strength within
      </div>
      <audio id="heroAudio" loop preload="auto">
  <source src="images/vardaan-ambient.mp3" type="audio/mpeg">
</audio>

<button id="soundToggle" class="sound-toggle">Sound Off</button>
      
    

    </section>

  </main>
<script>
  const audio = document.getElementById("heroAudio");
  const soundButton = document.getElementById("soundToggle");

  audio.volume = 0.10;

  soundButton.addEventListener("click", () => {
    if (audio.paused) {
      audio.play();
      soundButton.textContent = "Sound On";
    } else {
      audio.pause();
      soundButton.textContent = "Sound Off";
    }
  });
</script>
</body>
</html>
